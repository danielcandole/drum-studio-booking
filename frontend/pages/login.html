<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeatBase</title>
  </head>
  <body>
    <section class="auth-page">
      <div class="auth-visual"><blockquote></blockquote></div>
      <div class="auth-panel">
        <form class="auth-form" id="auth-form" novalidate>
          <span class="eyebrow">Welcome back</span>
          <h1>Login to BeatBase</h1>
          <p class="muted">Your next session is only a few clicks away.</p>
          <div class="form-group">
            <label for="email">Email address</label
            ><input
              class="input"
              id="email"
              name="email"
              type="email"
              required
              data-error="Please enter your email."
              placeholder="Enter your email"
            />
          </div>
          <div class="form-group">
            <div class="password-label-row">
              <label for="password">Password</label>
              <a href="#forgot-password" data-route="forgot-password">Forgot password?</a>
            </div>
            <div class="password-input-wrapper">
              <input
                class="input"
                id="password"
                name="password"
                type="password"
                required
                data-error="Please enter your password."
                placeholder="Enter your password"
              />
              <button
                class="password-visibility-toggle"
                type="button"
                data-password-toggle="password"
                aria-controls="password"
                aria-label="Show password"
                aria-pressed="false"
              ><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
            </div>
          </div>
          <button class="btn" type="submit">Login <i class="fa-solid fa-arrow-right"></i></button>
          <p class="muted">New to BeatBase? <a href="#register" data-route="register">Register</a></p>
        </form>
      </div>
    </section>
  </body>
</html>
