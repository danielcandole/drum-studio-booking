<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeatBase</title>
  </head>
  <body>
    <section class="auth-page">
      <div class="auth-visual"><blockquote></blockquote></div>
      <div class="auth-panel">
        <form class="auth-form" id="auth-form" novalidate>
          <span class="eyebrow">Join the community</span>
          <h1>Create your account</h1>
          <p class="muted">Book sessions or manage your studio in one place.</p>
          <div class="form-group">
            <label for="name">Full name</label
            ><input
              class="input"
              id="name"
              name="name"
              required
              data-error="Please enter your name."
              placeholder="Enter your full name"
            />
          </div>
          <div class="form-group">
            <label for="email">Email address</label
            ><input
              class="input"
              id="email"
              name="email"
              type="email"
              required
              data-error="Please enter your email."
              placeholder="Enter your email"
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label
            ><input
              class="input"
              id="password"
              name="password"
              type="password"
              required
              data-error="Please enter your password."
              placeholder="At least 8 characters"
            />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm password</label
            ><input
              class="input"
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              required
              data-error="Please confirm your password."
              placeholder="Confirm your password"
            />
          </div>
          <div class="form-group">
            <label>I am a...</label>
            <div class="role-cards">
              <button class="role-card active" type="button" data-role-choice="drummer">
                <i class="fa-solid fa-drum"></i><br /><strong>Drummer</strong><br /><span class="muted"
                  >Book practice sessions</span
                ></button
              ><button class="role-card" type="button" data-role-choice="owner">
                <i class="fa-solid fa-building"></i><br /><strong>Studio Owner</strong><br /><span class="muted"
                  >Manage your space</span
                >
              </button>
            </div>
          </div>
          <button class="btn" type="submit">Create account <i class="fa-solid fa-arrow-right"></i></button>
          <p class="muted">Already have an account? <a href="#login" data-route="login">Login</a></p>
        </form>
      </div>
    </section>
  </body>
</html>
