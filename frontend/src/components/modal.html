<div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <h2 id="modal-title">Please confirm</h2>
    <p id="modal-message"></p>
    <div class="btn-row">
      <button class="btn btn-danger" id="modal-cancel">
        <span id="modal-cancel-label">Cancel</span>
      </button>
      <button class="btn btn-secondary" id="modal-confirm">
        <i class="fa-solid fa-check"></i>
        <span id="modal-confirm-label">Confirm</span>
      </button>
    </div>
  </div>
</div>
